AWSTemplateFormatVersion: '2010-09-09'
Description: Shared demo VPCs and peering for the seven scenario stacks

Parameters:
  NetworkStackName:
    Type: String
    Default: cloudlink-network

Resources:
  DemoVpcA:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.60.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: CloudLink-Demo-VPC-A}]
  WebPeeringA:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-AppVpcId'
      PeerVpcId: !Ref DemoVpcA
      Tags: [{Key: Name, Value: CloudLink-Web-to-Demo-A}]
  WebAToDemoA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${NetworkStackName}-AppRoutesAId'
      DestinationCidrBlock: 10.60.0.0/16
      VpcPeeringConnectionId: !Ref WebPeeringA
  WebBToDemoA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${NetworkStackName}-AppRoutesBId'
      DestinationCidrBlock: 10.60.0.0/16
      VpcPeeringConnectionId: !Ref WebPeeringA
  DemoVpcB:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.61.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: CloudLink-Demo-VPC-B}]
  WebPeeringB:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-AppVpcId'
      PeerVpcId: !Ref DemoVpcB
      Tags: [{Key: Name, Value: CloudLink-Web-to-Demo-B}]
  WebAToDemoB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${NetworkStackName}-AppRoutesAId'
      DestinationCidrBlock: 10.61.0.0/16
      VpcPeeringConnectionId: !Ref WebPeeringB
  WebBToDemoB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${NetworkStackName}-AppRoutesBId'
      DestinationCidrBlock: 10.61.0.0/16
      VpcPeeringConnectionId: !Ref WebPeeringB
  DemoPeering:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId: !Ref DemoVpcA
      PeerVpcId: !Ref DemoVpcB
      Tags: [{Key: Name, Value: CloudLink-Demo-A-to-B}]

Outputs:
  DemoVpcA:
    Value: !Ref DemoVpcA
    Export: {Name: !Sub '${AWS::StackName}-DemoVpcA'}
  DemoVpcB:
    Value: !Ref DemoVpcB
    Export: {Name: !Sub '${AWS::StackName}-DemoVpcB'}
  WebPeeringA:
    Value: !Ref WebPeeringA
    Export: {Name: !Sub '${AWS::StackName}-WebPeeringA'}
  WebPeeringB:
    Value: !Ref WebPeeringB
    Export: {Name: !Sub '${AWS::StackName}-WebPeeringB'}
  DemoPeering:
    Value: !Ref DemoPeering
    Export: {Name: !Sub '${AWS::StackName}-DemoPeering'}
