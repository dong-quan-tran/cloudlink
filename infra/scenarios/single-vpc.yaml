# Each Scenario value is a separate stack with reserved CIDRs and neutral probe names.
# Web VPC management routes remain independent of every test fault.
AWSTemplateFormatVersion: '2010-09-09'
Description: CloudLink reusable single-VPC scenarios; deploy one stack per Scenario.
Parameters:
  Scenario:
    Type: String
    Default: sg-block-8080
    AllowedValues:
    - sg-block-8080
    - nacl-block-8080
    Description: Deploy a separate stack for each case. Each has reserved CIDRs and probe names.
  NetworkStackName:
    Type: String
    Default: cloudlink-network
  ServicesStackName:
    Type: String
    Default: cloudlink-services
  AppRouteTableAId:
    Type: String
    AllowedPattern: rtb-[0-9a-f]+
    Description: Physical ID of AppRoutesA in the existing network stack.
  AppRouteTableBId:
    Type: String
    AllowedPattern: rtb-[0-9a-f]+
    Description: Physical ID of AppRoutesB in the existing network stack.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Mappings:
  ScenarioSettings:
    sg-block-8080:
      SourceVpcCidr: 10.60.0.0/16
      SourceSubnetCidr: 10.60.1.0/24
      DestinationSubnetCidr: 10.60.2.0/24
      SourceName: CloudLink-Node-C
      DestinationName: CloudLink-Node-D
      ExpectedPing: PASS / PASS
      ExpectedTcp8080: FAIL / PASS
    nacl-block-8080:
      SourceVpcCidr: 10.61.0.0/16
      SourceSubnetCidr: 10.61.1.0/24
      DestinationSubnetCidr: 10.61.2.0/24
      SourceName: CloudLink-Node-E
      DestinationName: CloudLink-Node-F
      ExpectedPing: PASS / PASS
      ExpectedTcp8080: FAIL / PASS
Conditions:
  BlockDestination8080:
    Fn::Equals:
    - Ref: Scenario
    - sg-block-8080
  AllowDestination8080:
    Fn::Not:
    - Condition: BlockDestination8080
  UseDestinationAcl:
    Fn::Equals:
    - Ref: Scenario
    - nacl-block-8080
Resources:
  SourceVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock:
        Fn::FindInMap:
        - ScenarioSettings
        - Ref: Scenario
        - SourceVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-Source-VPC
      - Key: Project
        Value: CloudLink
      - Key: Scenario
        Value:
          Ref: Scenario
  SourceManagementPeering:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-AppVpcId
      PeerVpcId:
        Ref: SourceVpc
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-Web-to-Source
      - Key: Project
        Value: CloudLink
      - Key: Scenario
        Value:
          Ref: Scenario
  AppAToSource:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: AppRouteTableAId
      DestinationCidrBlock:
        Fn::FindInMap:
        - ScenarioSettings
        - Ref: Scenario
        - SourceVpcCidr
      VpcPeeringConnectionId:
        Ref: SourceManagementPeering
  AppBToSource:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: AppRouteTableBId
      DestinationCidrBlock:
        Fn::FindInMap:
        - ScenarioSettings
        - Ref: Scenario
        - SourceVpcCidr
      VpcPeeringConnectionId:
        Ref: SourceManagementPeering
  SourceSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: SourceVpc
      CidrBlock:
        Fn::FindInMap:
        - ScenarioSettings
        - Ref: Scenario
        - SourceSubnetCidr
      AvailabilityZone:
        Ref: AvailabilityZone
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-Source-Subnet
      - Key: Project
        Value: CloudLink
      - Key: Scenario
        Value:
          Ref: Scenario
  SourceRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: SourceVpc
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-Source-Routes
      - Key: Project
        Value: CloudLink
      - Key: Scenario
        Value:
          Ref: Scenario
  SourceAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: SourceSubnet
      RouteTableId:
        Ref: SourceRoutes
  SourceManagementReturn:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: SourceRoutes
      DestinationCidrBlock: 10.20.0.0/16
      VpcPeeringConnectionId:
        Ref: SourceManagementPeering
  SourceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Ref: SourceVpc
      GroupDescription: CloudLink scenario source probe
      SecurityGroupIngress:
      - IpProtocol: icmp
        FromPort: -1
        ToPort: -1
        CidrIp:
          Fn::FindInMap:
          - ScenarioSettings
          - Ref: Scenario
          - DestinationSubnetCidr
        Description: Ping from the other probe subnet
      SecurityGroupEgress:
      - IpProtocol: '-1'
        CidrIp: 0.0.0.0/0
        Description: Allow outbound; private subnets have no internet route
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-Source-SG
      - Key: Project
        Value: CloudLink
      - Key: Scenario
        Value:
          Ref: Scenario
  SourceTcp8080:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: SourceSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      CidrIp:
        Fn::FindInMap:
        - ScenarioSettings
        - Ref: Scenario
        - DestinationSubnetCidr
      Description: Test service from the other probe subnet
  SourceManagementSsh:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: SourceManagementPeering
    Properties:
      GroupId:
        Ref: SourceSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId:
        Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-AppSecurityGroupId
      Description: Web VPC management only; probe-to-probe SSH stays blocked
  SourceInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId:
        Ref: LatestAmiId
      InstanceType: t3.micro
      CreditSpecification:
        CPUCredits: standard
      KeyName:
        Fn::ImportValue:
          Fn::Sub: ${ServicesStackName}-ProbeKeyName
      PropagateTagsToVolumeOnCreation: true
      NetworkInterfaces:
      - DeviceIndex: '0'
        AssociatePublicIpAddress: false
        DeleteOnTermination: true
        SubnetId:
          Ref: SourceSubnet
        GroupSet:
        - Ref: SourceSecurityGroup
      BlockDeviceMappings:
      - DeviceName: /dev/xvda
        Ebs:
          VolumeSize: 8
          VolumeType: gp3
          DeleteOnTermination: true
      Tags:
      - Key: Name
        Value:
          Fn::FindInMap:
          - ScenarioSettings
          - Ref: Scenario
          - SourceName
      - Key: Project
        Value: CloudLink
      - Key: Scenario
        Value:
          Ref: Scenario
      - Key: CloudLinkRole
        Value: Probe
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          mkdir -p /opt/cloudlink
          printf 'CloudLink probe\n' > /opt/cloudlink/health
          cat > /etc/systemd/system/cloudlink-health.service <<'UNIT'
          [Unit]
          Description=CloudLink test HTTP endpoint
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=ec2-user
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/cloudlink
          Restart=always
          RestartSec=2
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now cloudlink-health.service
  DestinationSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: SourceVpc
      CidrBlock:
        Fn::FindInMap:
        - ScenarioSettings
        - Ref: Scenario
        - DestinationSubnetCidr
      AvailabilityZone:
        Ref: AvailabilityZone
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-Destination-Subnet
      - Key: Project
        Value: CloudLink
      - Key: Scenario
        Value:
          Ref: Scenario
  DestinationRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: SourceVpc
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-Destination-Routes
      - Key: Project
        Value: CloudLink
      - Key: Scenario
        Value:
          Ref: Scenario
  DestinationAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: DestinationSubnet
      RouteTableId:
        Ref: DestinationRoutes
  DestinationManagementReturn:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: DestinationRoutes
      DestinationCidrBlock: 10.20.0.0/16
      VpcPeeringConnectionId:
        Ref: SourceManagementPeering
  DestinationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Ref: SourceVpc
      GroupDescription: CloudLink scenario destination probe
      SecurityGroupIngress:
      - IpProtocol: icmp
        FromPort: -1
        ToPort: -1
        CidrIp:
          Fn::FindInMap:
          - ScenarioSettings
          - Ref: Scenario
          - SourceSubnetCidr
        Description: Ping from the other probe subnet
      SecurityGroupEgress:
      - IpProtocol: '-1'
        CidrIp: 0.0.0.0/0
        Description: Allow outbound; private subnets have no internet route
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-Destination-SG
      - Key: Project
        Value: CloudLink
      - Key: Scenario
        Value:
          Ref: Scenario
  DestinationTcp8080:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: AllowDestination8080
    Properties:
      GroupId:
        Ref: DestinationSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      CidrIp:
        Fn::FindInMap:
        - ScenarioSettings
        - Ref: Scenario
        - SourceSubnetCidr
      Description: Test service from the other probe subnet
  DestinationManagementSsh:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: SourceManagementPeering
    Properties:
      GroupId:
        Ref: DestinationSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId:
        Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-AppSecurityGroupId
      Description: Web VPC management only; probe-to-probe SSH stays blocked
  DestinationInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId:
        Ref: LatestAmiId
      InstanceType: t3.micro
      CreditSpecification:
        CPUCredits: standard
      KeyName:
        Fn::ImportValue:
          Fn::Sub: ${ServicesStackName}-ProbeKeyName
      PropagateTagsToVolumeOnCreation: true
      NetworkInterfaces:
      - DeviceIndex: '0'
        AssociatePublicIpAddress: false
        DeleteOnTermination: true
        SubnetId:
          Ref: DestinationSubnet
        GroupSet:
        - Ref: DestinationSecurityGroup
      BlockDeviceMappings:
      - DeviceName: /dev/xvda
        Ebs:
          VolumeSize: 8
          VolumeType: gp3
          DeleteOnTermination: true
      Tags:
      - Key: Name
        Value:
          Fn::FindInMap:
          - ScenarioSettings
          - Ref: Scenario
          - DestinationName
      - Key: Project
        Value: CloudLink
      - Key: Scenario
        Value:
          Ref: Scenario
      - Key: CloudLinkRole
        Value: Probe
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          mkdir -p /opt/cloudlink
          printf 'CloudLink probe\n' > /opt/cloudlink/health
          cat > /etc/systemd/system/cloudlink-health.service <<'UNIT'
          [Unit]
          Description=CloudLink test HTTP endpoint
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=ec2-user
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/cloudlink
          Restart=always
          RestartSec=2
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now cloudlink-health.service
  DestinationAcl:
    Type: AWS::EC2::NetworkAcl
    Condition: UseDestinationAcl
    Properties:
      VpcId:
        Ref: SourceVpc
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-Destination-ACL
      - Key: Project
        Value: CloudLink
      - Key: Scenario
        Value:
          Ref: Scenario
  DestinationAclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Condition: UseDestinationAcl
    Properties:
      SubnetId:
        Ref: DestinationSubnet
      NetworkAclId:
        Ref: DestinationAcl
  DenyInbound8080:
    Type: AWS::EC2::NetworkAclEntry
    Condition: UseDestinationAcl
    Properties:
      NetworkAclId:
        Ref: DestinationAcl
      RuleNumber: 100
      Protocol: 6
      RuleAction: deny
      Egress: false
      CidrBlock:
        Fn::FindInMap:
        - ScenarioSettings
        - Ref: Scenario
        - SourceSubnetCidr
      PortRange:
        From: 8080
        To: 8080
  AllowAclInbound:
    Type: AWS::EC2::NetworkAclEntry
    Condition: UseDestinationAcl
    Properties:
      NetworkAclId:
        Ref: DestinationAcl
      RuleNumber: 200
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
  AllowAclOutbound:
    Type: AWS::EC2::NetworkAclEntry
    Condition: UseDestinationAcl
    Properties:
      NetworkAclId:
        Ref: DestinationAcl
      RuleNumber: 200
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
Outputs:
  Scenario:
    Value:
      Ref: Scenario
  SourceName:
    Value:
      Fn::FindInMap:
      - ScenarioSettings
      - Ref: Scenario
      - SourceName
  SourceInstanceId:
    Value:
      Ref: SourceInstance
  SourcePrivateIp:
    Value:
      Fn::GetAtt:
      - SourceInstance
      - PrivateIp
  DestinationName:
    Value:
      Fn::FindInMap:
      - ScenarioSettings
      - Ref: Scenario
      - DestinationName
  DestinationInstanceId:
    Value:
      Ref: DestinationInstance
  DestinationPrivateIp:
    Value:
      Fn::GetAtt:
      - DestinationInstance
      - PrivateIp
  ExpectedPing:
    Description: Source to destination / destination to source
    Value:
      Fn::FindInMap:
      - ScenarioSettings
      - Ref: Scenario
      - ExpectedPing
  ExpectedTcp8080:
    Description: Source to destination / destination to source
    Value:
      Fn::FindInMap:
      - ScenarioSettings
      - Ref: Scenario
      - ExpectedTcp8080
