AWSTemplateFormatVersion: '2010-09-09'
Description: CloudLink cross-VPC lab for testing routing, firewall, and listener failures

Parameters:
  NetworkStackName:
    Type: String
    Default: cloudlink-network
  ServicesStackName:
    Type: String
    Default: cloudlink-services
  Scenario:
    Type: String
    Default: Healthy
    AllowedValues:
      - Healthy
      - MissingForwardRoute
      - MissingReturnRoute
      - SecurityGroupBlock
      - AclReplyBlock
      - NoListener
      - MultipleBlockers
    Description: Network configuration provisioned for the scenario node
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  HasForwardRoute: !Not [!Equals [!Ref Scenario, MissingForwardRoute]]
  HasReturnRoute: !Not [!Or [!Equals [!Ref Scenario, MissingReturnRoute], !Condition MultipleBlockers]]
  AllowsTcp: !Not [!Or [!Equals [!Ref Scenario, SecurityGroupBlock], !Condition MultipleBlockers]]
  DeniesAclReply: !Or [!Equals [!Ref Scenario, AclReplyBlock], !Condition MultipleBlockers]
  NoListener: !Equals [!Ref Scenario, NoListener]
  MultipleBlockers: !Equals [!Ref Scenario, MultipleBlockers]

Resources:
  ScenarioVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.30.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: CloudLink-Scenario-VPC}, {Key: Project, Value: CloudLink}]
  ScenarioSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ScenarioVpc
      AvailabilityZone: us-east-1a
      CidrBlock: 10.30.1.0/24
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: CloudLink-Scenario-Subnet}]
  ScenarioRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ScenarioVpc
      Tags: [{Key: Name, Value: CloudLink-Scenario-Routes}]
  ScenarioRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref ScenarioRoutes
      SubnetId: !Ref ScenarioSubnet

  # The lab peer carries the test. The app peer carries management SSH.
  LabToScenario:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      PeerVpcId: !Ref ScenarioVpc
      Tags: [{Key: Name, Value: CloudLink-Lab-to-Scenario}]
  AppToScenario:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-AppVpcId'
      PeerVpcId: !Ref ScenarioVpc
      Tags: [{Key: Name, Value: CloudLink-App-to-Scenario}]
  ForwardRoute:
    Type: AWS::EC2::Route
    Condition: HasForwardRoute
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${NetworkStackName}-ProbeRoutesAId'
      DestinationCidrBlock: 10.30.1.0/24
      VpcPeeringConnectionId: !Ref LabToScenario
  ScenarioReturnRoute:
    Type: AWS::EC2::Route
    Condition: HasReturnRoute
    Properties:
      RouteTableId: !Ref ScenarioRoutes
      DestinationCidrBlock: 10.10.1.0/24
      VpcPeeringConnectionId: !Ref LabToScenario
  AppRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${NetworkStackName}-AppRoutesAId'
      DestinationCidrBlock: 10.30.1.0/24
      VpcPeeringConnectionId: !Ref AppToScenario
  AppRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${NetworkStackName}-AppRoutesBId'
      DestinationCidrBlock: 10.30.1.0/24
      VpcPeeringConnectionId: !Ref AppToScenario
  ScenarioManagementReturn:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref ScenarioRoutes
      DestinationCidrBlock: 10.20.0.0/16
      VpcPeeringConnectionId: !Ref AppToScenario

  ScenarioSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Test traffic from Node A only
      VpcId: !Ref ScenarioVpc
      SecurityGroupIngress:
        - {IpProtocol: icmp, FromPort: 8, ToPort: 0, CidrIp: 10.10.1.10/32}
      Tags: [{Key: Name, Value: CloudLink-Scenario-SG}]
  ScenarioTestTcp:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: AllowsTcp
    Properties:
      GroupId: !Ref ScenarioSecurityGroup
      IpProtocol: tcp
      # The service always listens on 8080. The no-listener case permits 8081 instead.
      FromPort: !If [NoListener, 8081, 8080]
      ToPort: !If [NoListener, 8081, 8080]
      CidrIp: 10.10.1.10/32
  ScenarioManagementSsh:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: AppToScenario
    Properties:
      GroupId: !Ref ScenarioSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId:
        Fn::ImportValue: !Sub '${NetworkStackName}-AppSecurityGroupId'

  ScenarioAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref ScenarioVpc
      Tags: [{Key: Name, Value: CloudLink-Scenario-ACL}]
  ScenarioAclAllowInbound:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref ScenarioAcl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
  ScenarioAclAllowOutbound:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref ScenarioAcl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
  ScenarioAclDenyReply:
    Type: AWS::EC2::NetworkAclEntry
    Condition: DeniesAclReply
    Properties:
      NetworkAclId: !Ref ScenarioAcl
      RuleNumber: 90
      Protocol: 6
      RuleAction: deny
      Egress: true
      CidrBlock: 10.10.1.10/32
      PortRange: {From: 1024, To: 65535}
  ScenarioAclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    DependsOn: [ScenarioAclAllowInbound, ScenarioAclAllowOutbound]
    Properties:
      SubnetId: !Ref ScenarioSubnet
      NetworkAclId: !Ref ScenarioAcl

  ScenarioNode:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      CreditSpecification:
        CPUCredits: standard
      KeyName:
        Fn::ImportValue: !Sub '${ServicesStackName}-ProbeKeyName'
      SubnetId: !Ref ScenarioSubnet
      PrivateIpAddress: 10.30.1.10
      SecurityGroupIds: [!Ref ScenarioSecurityGroup]
      PropagateTagsToVolumeOnCreation: true
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 8, VolumeType: gp3, DeleteOnTermination: true}
      Tags:
        - {Key: Name, Value: CloudLink-Scenario-Node}
        - {Key: Project, Value: CloudLink}
        - {Key: CloudLinkRole, Value: Probe}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          mkdir -p /opt/cloudlink
          printf 'CloudLink scenario endpoint\n' > /opt/cloudlink/health
          cat > /etc/systemd/system/cloudlink-health.service <<'UNIT'
          [Unit]
          Description=CloudLink test HTTP endpoint
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=ec2-user
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/cloudlink
          Restart=always
          RestartSec=2
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now cloudlink-health.service

Outputs:
  ScenarioInstanceId:
    Value: !Ref ScenarioNode
  ScenarioPrivateIp:
    Value: !GetAtt ScenarioNode.PrivateIp
  ActiveScenario:
    Value: !Ref Scenario
  TestPort:
    Value: !If [NoListener, '8081', '8080']
