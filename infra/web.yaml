AWSTemplateFormatVersion: '2010-09-09'
Description: CloudLink HTTPS entry point and two-AZ application Auto Scaling Group
Parameters:
  NetworkStackName:
    Type: String
    Default: cloudlink-network
  ServicesStackName:
    Type: String
    Default: cloudlink-services
  RepositoryBranch:
    Type: String
    Default: main
    AllowedPattern: '^[A-Za-z0-9_][A-Za-z0-9._/-]*$'
    Description: GitHub branch cloned by each app instance at startup
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - Fn::ImportValue: !Sub '${NetworkStackName}-AppSubnetAId'
        - Fn::ImportValue: !Sub '${NetworkStackName}-AppSubnetBId'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${NetworkStackName}-LoadBalancerSecurityGroupId'
      Tags: [{Key: Project, Value: CloudLink}]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-AppVpcId'
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t3.micro
        CreditSpecification: {CpuCredits: standard}
        IamInstanceProfile:
          Name:
            Fn::ImportValue: !Sub '${ServicesStackName}-AppProfileName'
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            DeleteOnTermination: true
            Groups:
              - Fn::ImportValue: !Sub '${NetworkStackName}-AppSecurityGroupId'
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: volume
            Tags: [{Key: Project, Value: CloudLink}]
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash
                set -euo pipefail
                dnf install -y git nginx python3.11 python3.11-pip aws-cfn-bootstrap awscli-2 openssh-clients
                trap '/opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource AppAutoScalingGroup --region ${AWS::Region}' EXIT
                dnf install -y amazon-cloudwatch-agent
                useradd --system --create-home --home-dir /var/lib/cloudlink --shell /sbin/nologin cloudlink
                install -d -m 0700 -o cloudlink -g cloudlink /var/lib/cloudlink/.ssh
                install -d -m 0755 /etc/cloudlink /opt/cloudlink
                install -d -m 0750 -o cloudlink -g nginx /var/log/cloudlink
                install -m 0600 -o cloudlink -g cloudlink /dev/null /var/lib/cloudlink/.ssh/id_ed25519
                aws ssm get-parameter --region '${AWS::Region}' --name '${KeyParameter}' --with-decryption --query Parameter.Value --output text > /var/lib/cloudlink/.ssh/id_ed25519
                git clone --depth 1 --branch '${RepositoryBranch}' https://github.com/dong-quan-tran/cloudlink.git /opt/cloudlink/app
                python3.11 -m venv /opt/cloudlink/venv
                /opt/cloudlink/venv/bin/pip install -r /opt/cloudlink/app/requirements.txt
                cat > /etc/cloudlink/runtime.env <<'ENV'
                AWS_REGION=${AWS::Region}
                CLOUDLINK_TABLE_NAME=${TableName}
                CLOUDLINK_QUEUE_URL=${QueueUrl}
                CLOUDLINK_KEY_PATH=/var/lib/cloudlink/.ssh/id_ed25519
                CLOUDLINK_SOURCE_ADDRESS=private
                CLOUDLINK_SECURE_COOKIE=true
                ENV
                cat > /etc/nginx/nginx.conf <<'NGINX'
                user nginx;
                worker_processes auto;
                error_log /var/log/nginx/error.log;
                pid /run/nginx.pid;
                events { worker_connections 1024; }
                http {
                  include /etc/nginx/mime.types;
                  upstream cloudlink_app { server unix:/run/cloudlink/cloudlink.sock; }
                  server {
                    listen 80 default_server;
                    server_name _;
                    client_max_body_size 16k;
                    location / {
                      proxy_pass http://cloudlink_app;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    }
                  }
                }
                NGINX
                cat > /etc/systemd/system/cloudlink.service <<'UNIT'
                [Unit]
                Description=CloudLink web application
                After=network-online.target
                Wants=network-online.target
                [Service]
                User=cloudlink
                Group=nginx
                WorkingDirectory=/opt/cloudlink/app
                EnvironmentFile=/etc/cloudlink/runtime.env
                RuntimeDirectory=cloudlink
                RuntimeDirectoryMode=0750
                ExecStart=/opt/cloudlink/venv/bin/gunicorn --workers 2 --bind unix:/run/cloudlink/cloudlink.sock --umask 007 cloudlink.web:create_app()
                StandardOutput=append:/var/log/cloudlink/web.log
                StandardError=inherit
                Restart=always
                RestartSec=3
                [Install]
                WantedBy=multi-user.target
                UNIT
                cat > /etc/systemd/system/cloudlink-worker.service <<'UNIT'
                [Unit]
                Description=CloudLink queued connectivity worker
                After=network-online.target
                Wants=network-online.target
                [Service]
                User=cloudlink
                Group=nginx
                WorkingDirectory=/opt/cloudlink/app
                EnvironmentFile=/etc/cloudlink/runtime.env
                ExecStart=/opt/cloudlink/venv/bin/python -m cloudlink.worker
                StandardOutput=append:/var/log/cloudlink/worker.log
                StandardError=inherit
                Restart=always
                RestartSec=3
                TimeoutStopSec=30
                [Install]
                WantedBy=multi-user.target
                UNIT
                cat > /etc/cloudlink/cloudwatch.json <<'CWAGENT'
                {
                  "logs": {
                    "logs_collected": {
                      "files": {
                        "collect_list": [
                          {"file_path": "/var/log/cloudlink/web.log", "log_group_name": "${AppLogGroup}", "log_stream_name": "{instance_id}/web"},
                          {"file_path": "/var/log/cloudlink/worker.log", "log_group_name": "${AppLogGroup}", "log_stream_name": "{instance_id}/worker"}
                        ]
                      }
                    }
                  }
                }
                CWAGENT
                nginx -t
                systemctl daemon-reload
                systemctl enable --now cloudlink cloudlink-worker nginx
                /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
                  -a fetch-config -m ec2 -s -c file:/etc/cloudlink/cloudwatch.json
                for attempt in $(seq 1 30); do
                  if curl -fsS http://127.0.0.1/healthz && curl -fsS http://127.0.0.1/api/history; then
                    systemctl is-active --quiet cloudlink-worker
                    exit 0
                  fi
                  sleep 2
                done
                exit 1
              - KeyParameter:
                  Fn::ImportValue: !Sub '${ServicesStackName}-KeyParameterName'
                TableName:
                  Fn::ImportValue: !Sub '${ServicesStackName}-TableName'
                QueueUrl:
                  Fn::ImportValue: !Sub '${ServicesStackName}-QueueUrl'
                AppLogGroup:
                  Fn::ImportValue: !Sub '${ServicesStackName}-AppLogGroupName'
  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: Listener
    CreationPolicy:
      ResourceSignal: {Count: 2, Timeout: PT20M}
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT20M
        WaitOnResourceSignals: true
    Properties:
      MinSize: '2'
      MaxSize: '3'
      DesiredCapacity: '2'
      DefaultInstanceWarmup: 180
      MetricsCollection:
        - Granularity: 1Minute
          Metrics: [GroupInServiceInstances]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 900
      VPCZoneIdentifier:
        - Fn::ImportValue: !Sub '${NetworkStackName}-AppSubnetAId'
        - Fn::ImportValue: !Sub '${NetworkStackName}-AppSubnetBId'
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      TargetGroupARNs: [!Ref TargetGroup]
      Tags:
        - {Key: Name, Value: CloudLink-App, PropagateAtLaunch: true}
        - {Key: Project, Value: CloudLink, PropagateAtLaunch: true}
        - {Key: CloudLinkRole, Value: Web, PropagateAtLaunch: true}
  QueueScaling:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        TargetValue: 2
        CustomizedMetricSpecification:
          Metrics:
            - Id: backlog
              ReturnData: false
              MetricStat:
                Metric:
                  Namespace: AWS/SQS
                  MetricName: ApproximateNumberOfMessagesVisible
                  Dimensions:
                    - Name: QueueName
                      Value:
                        Fn::ImportValue: !Sub '${ServicesStackName}-QueueName'
                Stat: Average
            - Id: workers
              ReturnData: false
              MetricStat:
                Metric:
                  Namespace: AWS/AutoScaling
                  MetricName: GroupInServiceInstances
                  Dimensions:
                    - Name: AutoScalingGroupName
                      Value: !Ref AppAutoScalingGroup
                Stat: Average
            - Id: jobs_per_worker
              ReturnData: true
              Expression: 'IF(workers > 0, backlog / workers, backlog)'
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: CloudLink class dashboard
        PriceClass: PriceClass_100
        HttpVersion: http2
        IPV6Enabled: true
        Origins:
          - Id: cloudlink-alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: cloudlink-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        CustomErrorResponses:
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}

  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-monitoring'
      DashboardBody: !Sub
        - |
          {
            "start": "-PT3H",
            "widgets": [
              {"type": "metric", "x": 0, "y": 0, "width": 8, "height": 6, "properties": {
                "title": "CloudFront viewer requests", "region": "us-east-1", "period": 60, "stat": "Sum",
                "metrics": [["AWS/CloudFront", "Requests", "DistributionId", "${WebDistribution}", "Region", "Global"]]
              }},
              {"type": "metric", "x": 8, "y": 0, "width": 8, "height": 6, "properties": {
                "title": "CloudFront error rates (%)", "region": "us-east-1", "period": 60, "stat": "Average",
                "metrics": [
                  ["AWS/CloudFront", "4xxErrorRate", "DistributionId", "${WebDistribution}", "Region", "Global"],
                  ["AWS/CloudFront", "5xxErrorRate", "DistributionId", "${WebDistribution}", "Region", "Global"]
                ]
              }},
              {"type": "metric", "x": 16, "y": 0, "width": 8, "height": 6, "properties": {
                "title": "Load balancer requests and 5xx errors", "region": "${AWS::Region}", "period": 60, "stat": "Sum",
                "metrics": [
                  ["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}"],
                  ["AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", {"label": "Load balancer 5xx", "yAxis": "right"}],
                  ["AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", {"label": "App server 5xx", "yAxis": "right"}]
                ]
              }},
              {"type": "metric", "x": 0, "y": 6, "width": 8, "height": 6, "properties": {
                "title": "Healthy app instances and response time", "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  ["AWS/ApplicationELB", "HealthyHostCount", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", "TargetGroup", "${TargetGroup.TargetGroupFullName}", {"stat": "Minimum"}],
                  ["AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", "TargetGroup", "${TargetGroup.TargetGroupFullName}", {"stat": "p95", "label": "p95 response (seconds)", "yAxis": "right"}]
                ]
              }},
              {"type": "metric", "x": 8, "y": 6, "width": 8, "height": 6, "properties": {
                "title": "Diagnostic queue and dead-letter queue", "region": "${AWS::Region}", "period": 60, "stat": "Maximum",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${JobsQueueName}", {"label": "Waiting"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesNotVisible", "QueueName", "${JobsQueueName}", {"label": "In progress"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${DeadLetterQueueName}", {"label": "Dead-letter queue"}]
                ]
              }},
              {"type": "metric", "x": 16, "y": 6, "width": 8, "height": 6, "properties": {
                "title": "Oldest waiting job (seconds)", "region": "${AWS::Region}", "period": 60, "stat": "Maximum",
                "metrics": [["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${JobsQueueName}"]]
              }},
              {"type": "log", "x": 0, "y": 12, "width": 14, "height": 6, "properties": {
                "title": "Completed diagnostics by mode, type and outcome", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${AppLogGroup}' | filter event = 'diagnostic_completed' | stats count(*) as completed, pct(duration_ms, 95) as p95_ms by mode, test_type, outcome | sort completed desc"
              }},
              {"type": "log", "x": 14, "y": 12, "width": 10, "height": 6, "properties": {
                "title": "Diagnostic execution errors", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${AppLogGroup}' | filter event = 'diagnostic_execution_error' or outcome = 'probe_unavailable' | fields coalesce(reason, outcome) as error_kind | stats count(*) as events by error_kind | sort events desc"
              }}
            ]
          }
        - AppLogGroup:
            Fn::ImportValue: !Sub '${ServicesStackName}-AppLogGroupName'
          JobsQueueName:
            Fn::ImportValue: !Sub '${ServicesStackName}-QueueName'
          DeadLetterQueueName:
            Fn::ImportValue: !Sub '${ServicesStackName}-DeadLetterQueueName'

Outputs:
  WebUrl:
    Value: !Sub 'https://${WebDistribution.DomainName}/'
  AutoScalingGroupName:
    Value: !Ref AppAutoScalingGroup
  TargetGroupArn:
    Value: !Ref TargetGroup
  MonitoringDashboardName:
    Value: !Ref MonitoringDashboard
