AWSTemplateFormatVersion: '2010-09-09'
Description: CloudLink web application network across two Availability Zones
Parameters:
  CloudFrontPrefixListId:
    Type: String
    Description: AWS managed CloudFront origin-facing prefix list in us-east-1

Resources:
  AppVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: CloudLink-App-VPC}, {Key: Project, Value: CloudLink}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: CloudLink-App-IGW}]
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref AppVpc
  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      AvailabilityZone: us-east-1a
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: CloudLink-App-Subnet-A}]
  AppRoutesA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AppVpc
      Tags: [{Key: Name, Value: CloudLink-App-Routes-A}]
  AppRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref AppRoutesA
      SubnetId: !Ref AppSubnetA
  AppInternetRouteA:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref AppRoutesA
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      AvailabilityZone: us-east-1b
      CidrBlock: 10.20.2.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: CloudLink-App-Subnet-B}]
  AppRoutesB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AppVpc
      Tags: [{Key: Name, Value: CloudLink-App-Routes-B}]
  AppRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref AppRoutesB
      SubnetId: !Ref AppSubnetB
  AppInternetRouteB:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref AppRoutesB
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP origin access from CloudFront only
      VpcId: !Ref AppVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
      Tags: [{Key: Name, Value: CloudLink-ALB-SG}]
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application access from the load balancer only
      VpcId: !Ref AppVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Tags: [{Key: Name, Value: CloudLink-App-SG}]

Outputs:
  AppVpcId:
    Value: !Ref AppVpc
    Export:
      Name: !Sub '${AWS::StackName}-AppVpcId'
  AppSubnetAId:
    Value: !Ref AppSubnetA
    Export:
      Name: !Sub '${AWS::StackName}-AppSubnetAId'
  AppSubnetBId:
    Value: !Ref AppSubnetB
    Export:
      Name: !Sub '${AWS::StackName}-AppSubnetBId'
  AppRoutesAId:
    Value: !Ref AppRoutesA
    Export:
      Name: !Sub '${AWS::StackName}-AppRoutesAId'
  AppRoutesBId:
    Value: !Ref AppRoutesB
    Export:
      Name: !Sub '${AWS::StackName}-AppRoutesBId'
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-AppSecurityGroupId'
  LoadBalancerSecurityGroupId:
    Value: !Ref LoadBalancerSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-LoadBalancerSecurityGroupId'
